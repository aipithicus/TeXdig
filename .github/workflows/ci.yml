name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version is read from the packageManager field in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # single-version policy: fails if the lockfile could be deduplicated
      - run: pnpm dedupe --check

      - run: pnpm grammars:check
      - run: pnpm typecheck
      - run: pnpm registry:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm conformance:check
      - run: pnpm build
      - run: pnpm pack-check
      - run: pnpm tools:verify
